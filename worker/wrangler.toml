name = "gizmagick-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"
# The self-contained admin client is serialized into a nonce-protected script.
# Name-preservation helpers live outside that function and cannot travel with it.
keep_names = false
# Keep the existing admin/API hostname enabled independently of future routes.
workers_dev = true

[[d1_databases]]
binding = "GIZMAGICK_DB"
database_name = "gizmagick-library"
database_id = "bb2ac5dd-05af-4e2f-8a4b-51120fac5da4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "GIZMAGICK_MEDIA"
bucket_name = "gizmagick-media"

# Quarantined admin uploads only. No custom domain or public r2.dev access.
# Never point this binding at the publicly readable gizmagick-media bucket.
[[r2_buckets]]
binding = "GIZMAGICK_DRAFTS"
bucket_name = "gizmagick-drafts"

[vars]
GIZMAGICK_DRAFT_UPLOADS_ENABLED = "true"
# Phase 7T: authorized private intake rollout, after migrations 0010-0011.
# Availability is not permission to reserve a track or upload the library.
GIZMAGICK_ORIGINAL_IMPORTS_ENABLED = "true"
# Phase 7U: original plan preparation enabled; this does not enable public copies.
# Phase 7V copy-only test: the existing reserved Lena's Home plan only.
GIZMAGICK_ORIGINAL_PUBLICATION_ENABLED = "true"
# Migration 0003 is applied. Administrator attestations remain private only.
GIZMAGICK_DRAFT_REVIEWS_ENABLED = "true"
# Phase 7L private-only rollout: apply migrations 0005-0009 before deployment.
# Preparing packages or rechecking private audio never publishes a track.
GIZMAGICK_REVIEW_PACKAGE_BATCHES_ENABLED = "true"
GIZMAGICK_REVIEW_VERIFICATION_BATCHES_ENABLED = "true"
# Readiness/reservation stay enabled. Phase 7V temporarily enables bounded copies.
# Existing files/catalog entries remain public when writes are closed again.
GIZMAGICK_PUBLICATION_INTENTS_ENABLED = "true"
# Temporarily authorized two-object original copy test. Close after verification.
GIZMAGICK_BOUNDED_PUBLIC_COPY_ENABLED = "true"
# Final catalog test completed; fresh rollout authorization is required for more writes.
GIZMAGICK_BOUNDED_PUBLICATION_FINAL_ENABLED = "false"
# Local browser walkthrough and cloud preflight passed. Requires reviews enabled.
GIZMAGICK_DRAFT_METADATA_ENABLED = "true"
# Phase 7A only inspects attested drafts; it does not enable publication.
GIZMAGICK_PUBLICATION_PREFLIGHT_ENABLED = "true"
# Phase 7V: shared writes serve bounded copies only; both catalog gates stay off.
# Close this and the copy gate after verifying the two authorized public objects.
GIZMAGICK_PUBLICATION_ENABLED = "true"
# Phase 7N: shared writes must not enable the old v1 catalog path.
# Legacy publishing requires this separate explicit opt-in; leave it disabled.
GIZMAGICK_LEGACY_PUBLICATION_ENABLED = "false"
GIZMAGICK_MEDIA_BASE_URL = "https://media.gizmagick.com"
GIZMAGICK_APP_ORIGINS = "https://gizmagick.com,https://www.gizmagick.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5180,http://127.0.0.1:5180"

# Public Access application identifiers supplied by the administrator.
# Admin routes still fail closed until the private email allowlist is configured.
GIZMAGICK_ACCESS_TEAM_DOMAIN = "https://black-resonance-a976.cloudflareaccess.com"
GIZMAGICK_ACCESS_AUD = "b6e219cb96a0117d174511b52ed7df377fc4a1f7389de4d6e177388ce02a1687"
GIZMAGICK_ADMIN_ORIGIN = "https://gizmagick-worker.nin10dos.workers.dev"
# Keep the admin email allowlist out of Git: wrangler secret put GIZMAGICK_ADMIN_EMAILS.

[durable_objects]
bindings = [
  { name = "ROOM_HUB", class_name = "RoomHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]

# No new routes/custom domains are part of this rollout. In particular, do not
# route gizmagick.com/* here: this Worker does not serve the Pages frontend.
# Review the dashboard-only legacy *.wizamp.app/* route before deployment.
