name = "gizmagick-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "GIZMAGICK_DB"
database_name = "gizmagick-library"
database_id = "bb2ac5dd-05af-4e2f-8a4b-51120fac5da4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "GIZMAGICK_MEDIA"
bucket_name = "gizmagick-media"

[vars]
GIZMAGICK_MEDIA_BASE_URL = "https://media.gizmagick.com"
GIZMAGICK_APP_ORIGINS = "https://gizmagick.com,https://www.gizmagick.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5180,http://127.0.0.1:5180"

# Admin routes fail closed until Access is provisioned. Add the real team domain,
# application AUD, and admin origin here during the authorized setup (not guesses).
# GIZMAGICK_ACCESS_TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
# GIZMAGICK_ACCESS_AUD = "<application AUD>"
# GIZMAGICK_ADMIN_ORIGIN = "https://<existing Worker hostname>"
# Keep the admin email allowlist out of Git: wrangler secret put GIZMAGICK_ADMIN_EMAILS.

[durable_objects]
bindings = [
  { name = "ROOM_HUB", class_name = "RoomHub" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomHub"]

# If you plan to bind a custom domain later:
# routes = [
#   { pattern = "api.yourdomain.com/*", custom_domain = true }
# ]
